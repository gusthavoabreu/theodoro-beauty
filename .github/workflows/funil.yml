# Copia os totais do funil da IA da clínica para a branch `dados`, de onde o painel /painel/ lê.
# A IA só responde em HTTP, e uma página HTTPS não pode buscar HTTP direto. A branch `dados` fica
# fora da `main` para a atualização não republicar o site. O JSON só tem totais por mês.
name: Funil do painel

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: funil-do-painel

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dados
      - name: Baixar os totais
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 20 \
            http://ia-theodoro.2.28.9.8.sslip.io/publico/funil -o /tmp/novo.json
          jq -e '.meses | length > 0' /tmp/novo.json > /dev/null
      - name: Gravar se os números mudaram
        run: |
          if diff <(jq -S .meses funil.json) <(jq -S .meses /tmp/novo.json) > /dev/null; then
            echo "Sem mudança."
            exit 0
          fi
          jq . /tmp/novo.json > funil.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funil.json
          git commit -m "Atualiza os totais do funil"
          git push
